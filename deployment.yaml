apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
        - name: placement-portal
          image: abhinesh18g/college-placement-portal:v2
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: placement-service
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
